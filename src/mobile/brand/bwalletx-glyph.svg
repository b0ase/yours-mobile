<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 4 120 120" width="1024" height="1024" role="img" aria-label="bWalletX">
  <!-- bWalletX mark: the bWallet b plus a gold x top-right (see bwallet-glyph.svg).
       bWallet mark (gradient fill, bare letter): the bCorp geometric "b" from b-arc.svg — stem
       polygon with a 45° flag-cut top, bowl r33 with an r15 counter. viewBox shifted
       (-4 4) to optically centre the letter; the tile scales it to 74% about that
       centre (56,64). PNGs are rendered by scripts/gen-brand-mark.sh.
       Gradient is userSpaceOnUse over the whole letter (y 12 -> 105) so stem and bowl
       share ONE ramp; per-shape bounding-box gradients would split the b at the join. -->
  <defs><linearGradient id="bgold" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="105"><stop offset="0" stop-color="#FFE58A"/><stop offset="0.55" stop-color="#FFD24D"/><stop offset="1" stop-color="#C98F00"/></linearGradient><mask id="bh"><rect x="-10" y="-10" width="140" height="140" fill="#fff"/><circle cx="60" cy="72" r="15" fill="#000"/></mask></defs>
  <g fill="url(#bgold)" mask="url(#bh)">
    <polygon points="45,12 45,76 27,76 27,30"/>
    <circle cx="60" cy="72" r="33"/>
  </g>
    <path d="M73 15 L91 33 M91 15 L73 33" stroke="url(#bgold)" stroke-width="9" stroke-linecap="round" fill="none"/>
</svg>
