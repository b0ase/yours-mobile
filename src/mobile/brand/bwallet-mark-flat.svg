<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 4 120 120" width="1024" height="1024" role="img" aria-label="bWallet">
  <!-- bWallet mark (flat fill, app-icon tile on black): the bCorp geometric "b" from b-arc.svg — stem
       polygon with a 45° flag-cut top, bowl r33 with an r15 counter. viewBox shifted
       (-4 4) to optically centre the letter; the tile scales it to 74% about that
       centre (56,64). PNGs are rendered by scripts/gen-brand-mark.sh.
       Gradient is userSpaceOnUse over the whole letter (y 12 -> 105) so stem and bowl
       share ONE ramp; per-shape bounding-box gradients would split the b at the join. -->
  <defs><mask id="bh"><rect x="-10" y="-10" width="140" height="140" fill="#fff"/><circle cx="60" cy="72" r="15" fill="#000"/></mask></defs>
  <rect x="-4" y="4" width="120" height="120" fill="#000"/>
  <g transform="translate(56 64) scale(0.74) translate(-56 -64)">
  <g fill="#FFD24D" mask="url(#bh)">
    <polygon points="45,12 45,76 27,76 27,30"/>
    <circle cx="60" cy="72" r="33"/>
  </g>
  </g>
</svg>
