<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" role="img" aria-label="bBot"><style>.bbot{display:inline-block;flex-shrink:0;overflow:visible}
.bbot-bob{animation:bbot-bob 3.2s ease-in-out infinite}
.bbot-eyes{transform-box:fill-box;transform-origin:center;animation:bbot-blink 5.5s ease-in-out infinite}
.bbot-tip{animation:bbot-pulse 2.4s ease-in-out infinite}
@keyframes bbot-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.45px)}}
@keyframes bbot-blink{0%,44%,50%,100%{transform:scaleY(1)}47%{transform:scaleY(.12)}}
@keyframes bbot-pulse{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.bbot-bob,.bbot-eyes,.bbot-tip{animation:none}}</style><rect x="4" y="20.5" width="16" height="2.7" rx="1.35" fill="#8A6400"/><g class="bbot-bob"><rect x="11" y="1.8" width="2" height="2.8" rx="1" fill="#8A6400"/><circle class="bbot-tip" cx="12" cy="2.1" r="1.8" fill="#F5B800" stroke="#8A6400" stroke-width=".7"/><rect x="9.4" y="14.4" width="5.2" height="1.6" fill="#8A6400"/><rect x="2.8" y="4.3" width="18.4" height="10.6" rx="3.2" fill="#F5B800" stroke="#8A6400" stroke-width=".9"/><rect x="4.8" y="6.4" width="14.4" height="6.3" rx="3.15" fill="#0F1013"/><g class="bbot-eyes"><rect x="7" y="7.85" width="3.6" height="3.4" rx="1.4" fill="#F5B800"/><rect x="13.4" y="7.85" width="3.6" height="3.4" rx="1.4" fill="#F5B800"/></g><rect x="6.2" y="15.6" width="11.6" height="4.3" rx="1.6" fill="#F5B800" stroke="#8A6400" stroke-width=".9"/></g></svg>
